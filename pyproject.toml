[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ime-copilot"
version = "0.5.0"
description = "IME Copilot - PDF ingestion, OCR and treatment ledger on Azure"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.60",
]

[project.optional-dependencies]
azure = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
    "openai>=1.60",
    "anthropic>=0.75",
    "psycopg[binary]>=3.1",
]
aws = ["boto3>=1.34"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
ime = "ime_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["ime_copilot*"]

[tool.setuptools.package-data]
ime_copilot = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
