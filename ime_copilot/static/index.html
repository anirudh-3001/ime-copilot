<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IME Copilot</title>
<style>
  :root {
    --bg:#f5f4f0; --panel:#ffffff; --sunk:#efede7; --text:#1d1c1a; --muted:#6b6962; --line:#e2dfd6;
    --accent:#1f5fa6; --accent-soft:#e6eef8; --ok:#2f7a4d; --ok-soft:#e5f2ea; --warn:#8a5a00; --warn-soft:#fbf1dc;
    --mark:#fff0a8; --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171716; --panel:#21211f; --sunk:#1b1b1a; --text:#ecebe6; --muted:#a19f98; --line:#34332f;
      --accent:#86b6ec; --accent-soft:#22303f; --ok:#79c79a; --ok-soft:#1f3328; --warn:#e7b65e; --warn-soft:#3a2f1b;
      --mark:#5a4d12; --shadow:none; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    background:var(--bg); color:var(--text); }
  button { font:inherit; cursor:pointer; }
  .app { display:grid; grid-template-columns: 300px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .brand { padding:18px 18px 12px; }
  .brand h1 { font-size:18px; margin:0; letter-spacing:-.01em; }
  .brand p { margin:2px 0 0; color:var(--muted); font-size:12.5px; }
  .local { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:4px 9px; border-radius:999px;
    background:var(--ok-soft); color:var(--ok); font-size:12px; font-weight:600; }
  .local::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .drop { margin:6px 14px 10px; border:1.5px dashed var(--line); border-radius:12px; padding:14px; text-align:center;
    color:var(--muted); font-size:13px; transition:.15s; }
  .drop.over { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .drop button { margin-top:8px; }
  .btn { padding:8px 14px; border-radius:9px; border:1px solid transparent; background:var(--accent); color:#fff; font-weight:600; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn.ghost { background:transparent; border-color:var(--line); color:var(--text); font-weight:500; }
  .section-label { padding:8px 18px 4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .cases { overflow:auto; padding:0 8px 12px; flex:1; }
  .case { width:100%; text-align:left; background:none; border:0; color:inherit; padding:9px 10px; border-radius:9px; display:block; }
  .case:hover { background:var(--sunk); }
  .case.active { background:var(--accent-soft); }
  .case b { display:block; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .caserow { position:relative; }
  .caserow .edit { position:absolute; right:6px; top:8px; border:0; background:none; color:var(--muted); padding:2px 6px; border-radius:6px; opacity:0; }
  .caserow:hover .edit, .caserow .edit:focus { opacity:1; }
  .caserow .edit:hover { background:var(--line); color:var(--text); }
  .case .sub { display:block; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .case .file { display:block; color:var(--muted); font-size:11.5px; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .case .warnname { color:var(--warn); }
  .finder { margin:2px 14px 6px; position:relative; }
  .finder input, .rename input { width:100%; padding:7px 9px 7px 30px; border:1px solid var(--line); border-radius:9px; background:var(--sunk); color:var(--text); font:inherit; font-size:13.5px; }
  .finder::before { content:"⌕"; position:absolute; left:10px; top:5px; color:var(--muted); font-size:16px; }
  .rename { padding:6px 10px; } .rename input { padding-left:9px; }
  .count { float:right; text-transform:none; letter-spacing:0; font-weight:500; }
  .md h3 { font-size:14.5px; margin:14px 0 4px; } .md h3:first-child { margin-top:0; }
  .md ul { margin:4px 0 8px; padding-left:20px; } .md li { margin:2px 0; } .md p { margin:4px 0 8px; }
  .case span { color:var(--muted); font-size:12.5px; }
  .job { margin:0 14px 10px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--sunk); font-size:13px; }
  .job .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin:8px 0 6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s; }
  .bar.indeterminate i { width:30%; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left:-30%; } 100% { margin-left:100%; } }
  .job .meta, .muted { color:var(--muted); font-size:12.5px; }
  .job.error { border-color:var(--warn); background:var(--warn-soft); }
  .foot { padding:10px 18px 14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .top { padding:14px 28px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .top h2 { margin:0; font-size:17px; }
  .thread { flex:1; overflow:auto; padding:22px 28px 8px; }
  .empty { max-width:620px; margin:8vh auto 0; text-align:center; color:var(--muted); }
  .empty h3 { color:var(--text); font-size:20px; margin:0 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--text); padding:7px 12px; border-radius:999px; font-size:13.5px; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .qa { max-width:860px; margin:0 auto 22px; }
  .q { margin-left:auto; width:fit-content; max-width:80%; background:var(--accent); color:#fff; padding:9px 14px;
    border-radius:16px 16px 4px 16px; margin-bottom:10px; }
  @media (prefers-color-scheme: dark) { .q, .btn:not(.ghost) { color:#10161d; } }
  .a { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .a .text { white-space:pre-wrap; }
  .pg { display:inline-block; padding:0 6px; margin:0 1px; border-radius:6px; background:var(--accent-soft); color:var(--accent);
    font-size:12.5px; font-weight:600; border:0; line-height:1.6; vertical-align:baseline; white-space:nowrap; }
  .pg:hover { outline:1px solid var(--accent); }
  .a h4 { margin:16px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td.code { font-family:ui-monospace, "SF Mono", Menlo, monospace; font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  .src { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .src:last-child { border-bottom:0; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; font-size:12px; color:var(--muted); }
  .badge { padding:2px 8px; border-radius:999px; font-weight:600; }
  .badge.ok { background:var(--ok-soft); color:var(--ok); }
  .badge.warn { background:var(--warn-soft); color:var(--warn); }
  .warning { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--warn-soft); color:var(--warn); font-size:13px; }
  .thinking { color:var(--muted); display:flex; gap:8px; align-items:center; }
  .dots i { display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; } .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
  .composer { padding:12px 28px 18px; }
  .composer form { max-width:860px; margin:0 auto; display:flex; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:8px 8px 8px 14px; box-shadow:var(--shadow); }
  .composer textarea { flex:1; border:0; outline:0; resize:none; background:transparent; color:var(--text); font:inherit; padding:6px 0; max-height:140px; }
  .composer form:focus-within { border-color:var(--accent); }
  .viewer { position:fixed; top:0; right:0; height:100vh; width:min(560px, 100vw); background:var(--panel); border-left:1px solid var(--line);
    box-shadow:-8px 0 24px rgba(0,0,0,.08); transform:translateX(100%); transition:transform .2s; display:flex; flex-direction:column; z-index:5; }
  .viewer.open { transform:none; }
  .viewer header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .viewer header h3 { margin:0; font-size:15px; flex:1; }
  .viewer pre { margin:0; padding:18px; overflow:auto; flex:1; white-space:pre-wrap; font:13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
  mark { background:var(--mark); color:inherit; border-radius:3px; padding:1px 0; }
  .key { display:none; margin:0 14px 10px; }
  .key input { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--sunk); color:var(--text); font:inherit; }
  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:100vh; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    .cases { max-height:180px; }
    .thread, .composer, .top { padding-left:16px; padding-right:16px; }
    main { min-height:70vh; }
  }

  /* pinned case summary */
  .summary { border-bottom:1px solid var(--line); background:var(--panel); }
  .sumbar { display:flex; align-items:center; gap:10px; padding:10px 28px; flex-wrap:wrap; }
  .sumbar .pin { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
  .facts { display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0; }
  .fact { background:var(--sunk); border-radius:8px; padding:2px 9px; font-size:13px; white-space:nowrap; }
  .fact span { color:var(--muted); margin-right:4px; }
  .sumbody { display:none; padding:0 28px 14px; max-height:58vh; overflow:auto; }
  .summary.open .sumbody { display:block; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:12px; position:sticky; top:0; background:var(--panel); z-index:1; }
  .tab { background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; color:var(--muted); font-weight:600; font-size:13.5px; }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .sec { padding:10px 0; border-bottom:1px solid var(--line); }
  .sec:last-child { border-bottom:0; }
  .sec h5 { margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .sec .body { white-space:pre-wrap; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px 24px; }
  .kv { display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-size:13.5px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .writing { color:var(--muted); font-size:13.5px; display:flex; gap:8px; align-items:center; padding:6px 0; }
  .small { font-size:12.5px; }
  @media (max-width: 760px) { .sumbar, .sumbody { padding-left:16px; padding-right:16px; } }
  @media print {
    aside, .composer, .thread, .viewer, .sumbar button, .tabs { display:none !important; }
    .app { display:block; height:auto; } main { display:block; }
    .summary .sumbody { display:block !important; max-height:none; overflow:visible; }
    .tabpane { display:block !important; margin-bottom:18px; }
    body { background:#fff; color:#000; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>IME Copilot</h1>
      <p>Answers from the claim file, with CPT codes and page numbers.</p>
      <div class="local" id="localBadge">Running on this computer</div>
    </div>
    <div class="drop" id="drop">
      Drop a PDF here
      <div><button class="btn" id="pick">Choose PDF</button></div>
      <input type="file" id="file" accept="application/pdf" hidden>
    </div>
    <div id="jobs"></div>
    <div class="key" id="keyBox"><input type="password" id="key" placeholder="API key from .env" aria-label="API key"></div>
    <div class="section-label">Case files <span class="count" id="caseCount"></span></div>
    <div class="finder"><input type="search" id="find" placeholder="Find patient, claim no., DOB…" aria-label="Find a case"></div>
    <div class="cases" id="cases"></div>
    <div class="foot" id="foot">Loading…</div>
  </aside>

  <main>
    <div class="top"><h2 id="caseTitle">No case selected</h2><span class="muted" id="caseMeta"></span></div>
    <div class="summary" id="summary" hidden>
      <div class="sumbar">
        <span class="pin">📌 Case summary</span>
        <div class="facts" id="facts"></div>
        <button class="btn ghost" id="sumToggle" aria-expanded="false">Show</button>
        <button class="btn ghost" id="sumPrint" title="Print or save as PDF">Print</button>
      </div>
      <div class="sumbody" id="sumBody"></div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <form id="askForm">
        <textarea id="question" rows="1" placeholder="Ask about this file. Follow-up questions work too." aria-label="Question"></textarea>
        <button class="btn" id="askBtn" type="submit">Ask</button>
      </form>
    </div>
  </main>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <header>
    <button class="btn ghost" id="prevPg" aria-label="Previous page">‹</button>
    <h3 id="vTitle">Page</h3>
    <button class="btn ghost" id="nextPg" aria-label="Next page">›</button>
    <button class="btn ghost" id="closeV">Close</button>
  </header>
  <pre id="vText"></pre>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const state = { cases: [], current: null, pageCount: 0, viewer: null, threads: {} };
const jobs = {};
const opened = new Set();
const SUGGEST = [
  'What physical therapy was billed?',
  'How many lumbar epidural injections were billed and on which dates?',
  'What did the MRI of the lumbar spine show?',
  "What are the patient's diagnoses?",
  'What office visits were billed?',
  'What questions does the IME referral ask?'
];

function savedKey() { try { return localStorage.getItem('imeKey') || ''; } catch (e) { return ''; } }
function headers(extra = {}) {
  const k = $('key').value.trim() || savedKey();
  return k ? {...extra, 'X-API-Key': k} : extra;
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: headers(opts.headers || {})});
  let d = null; try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { $('keyBox').style.display = 'block'; throw new Error('Enter the API key from .env (left panel).'); }
  if (!r.ok) throw new Error((d && d.detail) || ('HTTP ' + r.status));
  return d;
}
$('key').addEventListener('change', () => { try { localStorage.setItem('imeKey', $('key').value.trim()); } catch (e) {} loadCases(); });

async function loadHealth() {
  try {
    const h = await api('/health');
    if (h.api_key_required) $('keyBox').style.display = 'block';
    $('foot').innerHTML = `Answer model: <b>${esc(h.answer_model || 'none (search only)')}</b>` +
      (h.embed_model ? `<br>Search model: ${esc(h.embed_model)}` : '') +
      (h.escalation_model ? `<br>Escalation: ${esc(h.escalation_model)}` : '');
    $('localBadge').style.display = (h.provider === 'local' && !h.escalation_model) ? '' : 'none';
  } catch (e) { $('foot').textContent = 'Server not reachable.'; }
}

const detail = (c, k) => ((c.details || {})[k] || {}).value || '';
function caseLabel(c) { return c.display_name || detail(c, 'patient_name') || c.case_id; }
function caseSub(c) {
  const bits = [];
  if (detail(c, 'date_of_injury')) bits.push('DOI ' + detail(c, 'date_of_injury'));
  if (detail(c, 'claim_number')) bits.push('Claim ' + detail(c, 'claim_number'));
  bits.push(Number(c.page_count).toLocaleString() + ' pages');
  return bits.join(' · ');
}
function caseMatches(c, q) {
  if (!q) return true;
  const hay = [caseLabel(c), c.case_id, detail(c, 'patient_name'), detail(c, 'claim_number'), detail(c, 'date_of_birth'),
               detail(c, 'date_of_injury'), detail(c, 'employer'), detail(c, 'insurer')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

async function loadCases(select) {
  try { state.cases = await api('/cases'); }
  catch (e) { $('cases').innerHTML = `<div class="muted" style="padding:8px 10px">${esc(e.message)}</div>`; return; }
  renderCases();
  const running = new Set(Object.keys(jobs).filter(id => !['error', 'summarizing'].includes(jobs[id].stage)));
  const ready = state.cases.filter(c => !running.has(c.case_id));
  if (select) selectCase(select);
  else if (!state.current && ready.length) selectCase(ready[0].case_id);
}

function renderCases() {
  const running = new Set(Object.keys(jobs).filter(id => !['error', 'summarizing'].includes(jobs[id].stage)));
  const q = $('find').value.trim();
  const ready = state.cases.filter(c => !running.has(c.case_id));
  const shown = ready.filter(c => caseMatches(c, q));
  $('caseCount').textContent = ready.length ? (q ? `${shown.length} of ${ready.length}` : ready.length) : '';
  $('cases').innerHTML = shown.map(c => {
    const label = caseLabel(c), named = c.display_name || detail(c, 'patient_name');
    return `<div class="caserow"><button class="case${c.case_id === state.current ? ' active' : ''}" data-id="${esc(c.case_id)}">
       <b class="${named ? '' : 'warnname'}">${esc(label)}</b><span class="sub">${esc(caseSub(c))}</span>
       ${label !== c.case_id ? `<span class="file">${esc(c.case_id)}.pdf</span>` : ''}</button>
       <button class="edit" data-id="${esc(c.case_id)}" title="Rename" aria-label="Rename ${esc(label)}">✎</button></div>`;
  }).join('') || `<div class="muted" style="padding:8px 10px">${q ? 'No case matches “' + esc(q) + '”.' : 'No files yet. Upload a PDF above.'}</div>`;
  document.querySelectorAll('.case').forEach(b => b.onclick = () => selectCase(b.dataset.id));
  document.querySelectorAll('.caserow .edit').forEach(b => b.onclick = ev => { ev.stopPropagation(); startRename(b.dataset.id, b.parentElement); });
}
$('find').addEventListener('input', renderCases);

function startRename(id, row) {
  const c = state.cases.find(x => x.case_id === id); if (!c) return;
  row.innerHTML = `<div class="rename"><input value="${esc(caseLabel(c) === c.case_id ? '' : caseLabel(c))}"
    placeholder="${esc(detail(c, 'patient_name') || 'Patient name')}" aria-label="Case name">
    <div class="muted small" style="margin-top:3px">Enter to save · Esc to cancel · empty = use the name found in the file</div></div>`;
  const input = row.querySelector('input'); input.focus(); input.select();
  input.onkeydown = async ev => {
    if (ev.key === 'Escape') { renderCases(); return; }
    if (ev.key !== 'Enter') return;
    try { await api(`/cases/${encodeURIComponent(id)}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'},
                                                     body: JSON.stringify({display_name: input.value})}); }
    catch (e) { alert(e.message); }
    await loadCases(); if (state.current === id) selectCase(id);
  };
  input.onblur = () => setTimeout(() => { if (document.activeElement !== input) renderCases(); }, 150);
}

function selectCase(id) {
  const c = state.cases.find(x => x.case_id === id);
  state.current = id; state.pageCount = c ? c.page_count : 0;
  $('caseTitle').textContent = c ? caseLabel(c) : id;
  $('caseMeta').textContent = c ? (caseLabel(c) !== id ? `${id}.pdf · ` : '') + `${Number(c.page_count).toLocaleString()} pages` : '';
  document.querySelectorAll('.case').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  renderThread();
  $('summary').hidden = true; sumTab = 'summary';
  loadSummary(id);
  $('question').focus();
}

function renderThread() {
  const t = $('thread');
  const items = state.threads[state.current] || [];
  if (!state.current) {
    t.innerHTML = `<div class="empty"><h3>Upload a claim file to begin</h3>Drop a PDF on the left. A large file is read once; after that, questions take seconds.</div>`;
    return;
  }
  if (!items.length) {
    t.innerHTML = `<div class="empty"><h3>Ask anything about this file</h3>Every answer shows the pages it came from and the related CPT codes.
      <div class="chips">${SUGGEST.map(s => `<button class="chip">${esc(s)}</button>`).join('')}</div></div>`;
    t.querySelectorAll('.chip').forEach(b => b.onclick = () => ask(b.textContent));
    return;
  }
  t.innerHTML = '';
  items.forEach(el => t.appendChild(el));
  t.scrollTop = t.scrollHeight;
}

/* upload + progress */
$('pick').onclick = () => $('file').click();
$('file').onchange = () => { if ($('file').files[0]) upload($('file').files[0]); $('file').value = ''; };
const drop = $('drop');
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) upload(f); });

async function upload(f) {
  const id = f.name.replace(/\.pdf$/i, '').replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 64) || 'case';
  if (!/\.pdf$/i.test(f.name)) { jobs[id] = {stage:'error', error:'Only PDF files are accepted.'}; renderJobs(); return; }
  jobs[id] = {stage: 'uploading', label: `Uploading ${(f.size / 1048576).toFixed(0)} MB`, done: 0, total: 0};
  renderJobs(); loadCases();
  const fd = new FormData(); fd.append('file', f); fd.append('case_id', id); fd.append('wait', 'false');
  try { await api('/cases', {method: 'POST', body: fd}); poll(id); }
  catch (e) { jobs[id] = {stage: 'error', error: e.message}; renderJobs(); }
}

async function poll(id) {
  try {
    const s = await api(`/cases/${encodeURIComponent(id)}/status`);
    jobs[id] = s; renderJobs();
    if (s.stage === 'summarizing' && !opened.has(id)) {     // questions work now; the summary fills in
      opened.add(id); loadCases(id);
    }
    if (s.stage === 'ready') {
      setTimeout(() => {
        delete jobs[id]; renderJobs();
        if (opened.has(id)) { loadCases(); if (state.current === id) loadSummary(id); } else { opened.add(id); loadCases(id); }
      }, 800);
      return;
    }
    if (s.stage === 'error') return;
  } catch (e) { jobs[id] = {stage:'error', error: e.message}; renderJobs(); return; }
  setTimeout(() => poll(id), 1500);
}

function fmtTime(s) {
  if (s == null) return '';
  if (s < 60) return `${Math.max(1, Math.round(s))} s`;
  const m = Math.round(s / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
const STEP = {uploading: 1, queued: 1, reading: 1, ocr: 2, analyzing: 3, indexing: 4, summarizing: 5, ready: 5};
function renderJobs() {
  $('jobs').innerHTML = Object.entries(jobs).map(([id, j]) => {
    if (j.stage === 'error') return `<div class="job error"><div class="name">${esc(id)}</div><div class="meta">${esc(j.error || 'Failed')}</div>
      <button class="btn ghost dismiss" data-id="${esc(id)}" style="margin-top:8px">Dismiss</button></div>`;
    const pct = j.total ? Math.round(100 * j.done / j.total) : null;
    const unit = j.stage === 'indexing' ? 'passages' : j.stage === 'summarizing' ? 'sections' : 'pages';
    const counts = j.total > 1 ? `${j.done.toLocaleString()} / ${j.total.toLocaleString()} ${unit}` : '';
    const eta = j.stage_eta_s ? ` · about ${fmtTime(j.stage_eta_s)} left in this step` : '';
    return `<div class="job"><div class="name">${esc(id)}</div>
      <div>Step ${STEP[j.stage] || 1} of 5: ${esc(j.label || j.stage)}</div>
      <div class="bar${pct == null ? ' indeterminate' : ''}"><i style="width:${pct ?? 30}%"></i></div>
      <div class="meta">${counts}${eta}${j.elapsed_s ? ` · ${fmtTime(j.elapsed_s)} so far` : ''}</div></div>`;
  }).join('');
  document.querySelectorAll('.dismiss').forEach(b => b.onclick = () => { delete jobs[b.dataset.id]; renderJobs(); });
}

/* asking */
$('askForm').onsubmit = ev => { ev.preventDefault(); ask($('question').value); };
$('question').addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ask($('question').value); } });
$('question').addEventListener('input', () => { const q = $('question'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; });

async function ask(q) {
  q = (q || '').trim();
  if (!q) return;
  if (!state.current) { $('caseTitle').textContent = 'Upload or choose a case file first'; return; }
  const caseId = state.current;
  const list = state.threads[caseId] = state.threads[caseId] || [];
  const hist = (state.hist = state.hist || {})[caseId] = state.hist[caseId] || [];
  const el = document.createElement('div'); el.className = 'qa';
  el.innerHTML = `<div class="q">${esc(q)}</div><div class="a"><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>
    Planning the search, reading ${state.pageCount ? Number(state.pageCount).toLocaleString() + ' pages' : 'the file'} and writing the answer…</div></div>`;
  list.push(el); renderThread();
  $('question').value = ''; $('question').style.height = 'auto'; $('askBtn').disabled = true;
  const t0 = performance.now();
  try {
    const d = await api(`/cases/${encodeURIComponent(caseId)}/ask`, {method:'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: q, history: hist.slice(-3)})});
    hist.push({question: q, answer: d.answer});
    el.querySelector('.a').innerHTML = answerHtml(d, (performance.now() - t0) / 1000);
    el.querySelectorAll('.pg').forEach(b => b.onclick = () => openPage(caseId, +b.dataset.page, b.dataset.quote));
  } catch (e) {
    el.querySelector('.a').innerHTML = `<div class="warning">${esc(e.message)}</div>`;
  }
  $('askBtn').disabled = false;
  if (state.current === caseId) $('thread').scrollTop = $('thread').scrollHeight;
}

function pageBtn(n, quote) { return `<button class="pg" data-page="${n}" data-quote="${esc(quote || '')}">p. ${n}</button>`; }

function answerHtml(d, secs) {
  const quoteFor = {}; d.sources.forEach(s => { if (!quoteFor[s.page]) quoteFor[s.page] = s.quote; });
  const text = esc(d.answer)
    .replace(/\(\s*p(?:age|g)?\.?\s*(\d{1,5})\s*\)/gi, (m, n) => pageBtn(n, quoteFor[n]))
    .replace(/(^|[^>])\bp\.\s*(\d{1,5})\b/g, (m, pre, n) => pre + pageBtn(n, quoteFor[n]));
  const cpt = d.cpt_codes.length ? `<h4>Related CPT / HCPCS codes</h4><div class="tablewrap"><table><thead><tr><th>Code</th><th>Type</th><th>Billed</th><th>Dates</th><th>Pages</th></tr></thead><tbody>` +
    d.cpt_codes.map(c => `<tr><td class="code">${esc(c.code)}</td><td>${esc(c.category)}</td>
      <td class="num">${c.billed_lines ? `${c.billed_lines} line${c.billed_lines > 1 ? 's' : ''} · ${c.units} unit${c.units > 1 ? 's' : ''}<br><b>${money(c.billed_total)}</b>` : '<span class="muted">mentioned only</span>'}</td>
      <td class="num">${c.first_date ? esc(c.first_date) + (c.last_date && c.last_date !== c.first_date ? ' to ' + esc(c.last_date) : '') : '-'}</td>
      <td>${c.pages.slice(0, 8).map(p => pageBtn(p)).join('')}${c.pages.length > 8 ? ` <span class="muted">+${c.pages.length - 8}</span>` : ''}</td></tr>`).join('') +
    '</tbody></table></div>' : '';
  const src = d.sources.length ? `<h4>Sources (quoted from the file)</h4>` +
    d.sources.map(s => `<div class="src">${pageBtn(s.page, s.quote)}<div>“${esc(s.quote)}”</div></div>`).join('') : '';
  const methods = {
    model: ['ok', 'Verified against the file'], escalated: ['ok', 'Verified (second model)'],
    extractive: ['warn', 'Matching passages (no model)'], unverified: ['warn', 'Not verified: showing passages'] };
  const [cls, label] = methods[d.method] || ['warn', d.method];
  const warns = d.warnings.map(w => `<div class="warning">${esc(w)}</div>`).join('');
  return `<div class="text">${text}</div>${cpt}${src}${warns}
    <div class="badges"><span class="badge ${cls}">${esc(label)}</span>
      ${d.model ? `<span>${esc(d.model)}</span>` : ''}<span>${secs.toFixed(1)} s</span>
      <span>searched pages ${esc(d.searched_pages.join(', '))}</span></div>`;
}

/* page viewer */
async function openPage(caseId, n, quote) {
  state.viewer = {caseId, n};
  $('viewer').classList.add('open'); $('viewer').setAttribute('aria-hidden', 'false');
  $('vTitle').textContent = `Page ${n}`; $('vText').textContent = 'Loading…';
  try {
    const p = await api(`/cases/${encodeURIComponent(caseId)}/pages/${n}`);
    const extra = [p.page_type && p.page_type !== 'other' ? p.page_type.replace(/_/g, ' ') : '',
                   p.text_source === 'tesseract' ? `scanned${p.ocr_confidence != null ? ', OCR ' + Math.round(p.ocr_confidence * 100) + '%' : ''}` : '',
                   p.duplicate_of ? `duplicate of p. ${p.duplicate_of}` : ''].filter(Boolean).join(' · ');
    $('vTitle').textContent = `Page ${n}${extra ? ' · ' + extra : ''}`;
    $('vText').innerHTML = highlight(p.text || '(no text on this page)', quote);
    const m = $('vText').querySelector('mark'); if (m) m.scrollIntoView({block: 'center'});
  } catch (e) { $('vText').textContent = e.message; }
}
function highlight(text, quote) {
  const safe = esc(text);
  if (!quote) return safe;
  const words = esc(quote).split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!words.length) return safe;
  try { return safe.replace(new RegExp(words.join('\\s+'), 'i'), m => `<mark>${m}</mark>`); } catch (e) { return safe; }
}
$('closeV').onclick = () => { $('viewer').classList.remove('open'); $('viewer').setAttribute('aria-hidden', 'true'); };
$('prevPg').onclick = () => { const v = state.viewer; if (v && v.n > 1) openPage(v.caseId, v.n - 1); };
$('nextPg').onclick = () => { const v = state.viewer; if (v && (!state.pageCount || v.n < state.pageCount)) openPage(v.caseId, v.n + 1); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') $('closeV').click(); });


/* ---------------- pinned case summary */
let sumTab = 'summary', sumTimer = null;
function sumOpen() { try { return localStorage.getItem('imeSumOpen') !== '0'; } catch (e) { return true; } }
$('sumToggle').onclick = () => {
  const open = !$('summary').classList.contains('open');
  try { localStorage.setItem('imeSumOpen', open ? '1' : '0'); } catch (e) {}
  setSumOpen(open);
};
function setSumOpen(open) {
  $('summary').classList.toggle('open', open);
  $('sumToggle').textContent = open ? 'Hide' : 'Show';
  $('sumToggle').setAttribute('aria-expanded', String(open));
}
$('sumPrint').onclick = () => { setSumOpen(true); window.print(); };

async function loadSummary(caseId) {
  clearTimeout(sumTimer);
  let d;
  try { d = await api(`/cases/${encodeURIComponent(caseId)}/summary`); }
  catch (e) { $('summary').hidden = true; return; }
  if (state.current !== caseId) return;
  $('summary').hidden = false;
  renderSummary(d, caseId);
  setSumOpen($('summary').classList.contains('open') || sumOpen());
  if (d.overview_status === 'writing') sumTimer = setTimeout(() => loadSummary(caseId), 3000);
}

function renderSummary(d, caseId) {
  const f = d.facts, det = {}; f.details.forEach(x => det[x.field] = x);
  const chip = (label, x) => x ? `<span class="fact"><span>${esc(label)}</span>${esc(x.value)}</span>` : '';
  $('facts').innerHTML = chip('Patient', det.patient_name) + chip('DOI', det.date_of_injury) + chip('Claim', det.claim_number) +
    `<span class="fact"><span>Pages</span>${f.file.pages.toLocaleString()}</span>` +
    (f.billing.lines ? `<span class="fact"><span>Billed</span>${money(f.billing.total)}</span>` : '');

  const tabs = [['summary', 'Summary'], ['billing', `Billing (${f.billing.by_code.length} codes)`], ['file', 'Case & file']];
  const pane = id => `class="tabpane" data-pane="${id}" ${sumTab === id ? '' : 'hidden'}`;
  $('sumBody').innerHTML = `<div class="tabs" role="tablist">${tabs.map(([id, label]) =>
      `<button class="tab${sumTab === id ? ' active' : ''}" data-tab="${id}" role="tab">${esc(label)}</button>`).join('')}</div>
    <div ${pane('summary')}>${overviewHtml(d)}</div>
    <div ${pane('billing')}>${billingHtml(f)}</div>
    <div ${pane('file')}>${fileHtml(f)}</div>`;
  $('sumBody').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    sumTab = b.dataset.tab;
    $('sumBody').querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === b));
    $('sumBody').querySelectorAll('.tabpane').forEach(x => x.hidden = x.dataset.pane !== sumTab);
  });
  $('sumBody').querySelectorAll('.pg').forEach(b => b.onclick = () => openPage(caseId, +b.dataset.page, b.dataset.quote));
  const rw = $('rewrite'); if (rw) rw.onclick = async () => {
    rw.disabled = true;
    try { await api(`/cases/${encodeURIComponent(caseId)}/summary`, {method: 'POST'}); } catch (e) { alert(e.message); }
    loadSummary(caseId);
  };
}

function withPages(text, sources) {
  const quoteFor = {}; (sources || []).forEach(s => { if (!quoteFor[s.page]) quoteFor[s.page] = s.quote; });
  return esc(text).replace(/\(\s*p(?:age|g)?\.?\s*(\d{1,5})\s*\)/gi, (m, n) => pageBtn(n, quoteFor[n]))
                  .replace(/(^|[^>])\bp\.\s*(\d{1,5})\b/g, (m, pre, n) => pre + pageBtn(n, quoteFor[n]));
}

function mdLite(text, sources) {
  // headings (## ), bullets (- ), bold (**x**), paragraphs; page markers become buttons
  const lines = String(text || '').split('\n');
  let html = '', list = false, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.join(' ')}</p>`; para = []; } };
  const inline = t => withPages(t, sources).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const raw of lines) {
    const line = raw.trim();
    const h = line.match(/^#{1,4}\s+(.*)$/), li = line.match(/^[-*•]\s+(.*)$/);
    if (h || !line || !li) { if (list) { html += '</ul>'; list = false; } }
    if (h) { flushPara(); html += `<h3>${inline(h[1].replace(/\*\*/g, ''))}</h3>`; }
    else if (li) { flushPara(); if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (!line) flushPara();
    else para.push(inline(line));
  }
  if (list) html += '</ul>';
  flushPara();
  return html;
}

function overviewHtml(d) {
  if (d.overview_status === 'unavailable')
    return `<div class="muted">A written summary needs an answer model (IME_PROVIDER=local in .env). The billing and case tabs work without one.</div>`;
  if (d.overview_status === 'writing')
    return `<div class="writing"><span class="dots"><i></i><i></i><i></i></span>The model is reading the file and writing its summary (usually 1–3 minutes)… You can already ask questions below.</div>`;
  if (!d.overview) return `<div class="muted">No written summary yet. <button class="btn" id="rewrite" style="margin-left:8px">Write summary</button></div>`;
  const o = d.overview;
  if (o.version !== 2)       // summaries written by v0.5: ask for the new kind
    return `<div class="muted">This summary was written by an older version. <button class="btn" id="rewrite" style="margin-left:8px">Write the new summary</button></div>`;
  const warns = (o.warnings || []).map(w => `<div class="warning">${esc(w)}</div>`).join('');
  if (o.method === 'failed')
    return `${warns}<div class="badges"><button class="btn" id="rewrite">Try again</button></div>`;
  const badge = o.method === 'model' ? '<span class="badge ok">Written by the model from the file · sources linked to pages</span>'
                                     : '<span class="badge warn">Not linked to pages: check against the file</span>';
  return `<div class="md">${mdLite(o.text, o.sources)}</div>${warns}
    <div class="badges">${badge}${o.model ? `<span>${esc(o.model)}</span>` : ''}
      ${o.pages_read ? `<span>read ${o.pages_read.length} key pages + facts from every bill</span>` : ''}
      <button class="btn ghost" id="rewrite">Rewrite summary</button></div>`;
}

function billingHtml(f) {
  const b = f.billing;
  if (!b.lines) return '<div class="muted">No billed service lines were found in this file.</div>';
  const cats = b.by_category.map(c => `<tr><td>${esc(c.category)}</td><td class="num">${c.lines}</td><td class="num">${money(c.total)}</td></tr>`).join('');
  const codes = b.by_code.map(c => `<tr><td class="code">${esc(c.code)}</td><td>${esc(c.category)}</td><td class="num">${c.lines}</td>
      <td class="num">${c.units}</td><td class="num">${money(c.total)}</td>
      <td class="num">${c.first_date ? esc(c.first_date) + (c.last_date !== c.first_date ? ' to ' + esc(c.last_date) : '') : '-'}</td>
      <td>${c.pages.slice(0, 6).map(p => pageBtn(p)).join('')}${c.pages.length > 6 ? ` <span class="muted">+${c.pages.length - 6}</span>` : ''}</td></tr>`).join('');
  const prov = b.providers.length ? `<h4>Top billing providers</h4><div class="tablewrap"><table><tbody>${b.providers.map(p =>
      `<tr><td>${esc(p.name)}</td><td class="num">${money(p.total)}</td></tr>`).join('')}</tbody></table></div>` : '';
  return `<div class="kv" style="margin-bottom:12px"><dt>Total billed</dt><dd><b>${money(b.total)}</b> on ${b.lines} lines</dd>
      <dt>Dates of service</dt><dd>${esc(b.first_date || '-')} to ${esc(b.last_date || '-')}</dd></div>
    <h4>By type</h4><div class="tablewrap"><table><thead><tr><th>Type</th><th>Lines</th><th>Billed</th></tr></thead><tbody>${cats}</tbody></table></div>
    <h4>By CPT / HCPCS code</h4><div class="tablewrap"><table><thead><tr><th>Code</th><th>Type</th><th>Lines</th><th>Units</th><th>Billed</th><th>Dates</th><th>Pages</th></tr></thead><tbody>${codes}</tbody></table></div>
    ${prov}<p class="muted small">Totals are from billed lines the system could read and verify; check pages flagged for review.</p>`;
}

function fileHtml(f) {
  const details = f.details.length ? f.details.map(x => `<dt>${esc(x.label)}</dt><dd>${esc(x.value)} ${x.page ? pageBtn(x.page) : ''}
      ${x.other_values.length ? `<div class="muted small">Also seen: ${esc(x.other_values.join(', '))}</div>` : ''}</dd>`).join('')
    : '<dd class="muted">Not found</dd>';
  const types = f.file.page_types.map(t => `${esc(t.type.replace(/_/g, ' '))}: ${t.count}`).join(' · ');
  const dx = f.diagnoses.length ? `<h4>Diagnosis codes (ICD-10)</h4>` + f.diagnoses.map(d =>
      `<div class="src">${pageBtn(d.page)}<div><b>${esc(d.code)}</b> ${esc(d.description || '')}${d.first_seen_date ? ` <span class="muted">· first seen ${esc(d.first_seen_date)}</span>` : ''}</div></div>`).join('') : '';
  const qs = f.questions.length ? `<h4>Questions from the IME referral</h4>` + f.questions.map(q =>
      `<div class="src">${pageBtn(q.page)}<div><b>${esc(q.number)}.</b> ${esc(q.text)}</div></div>`).join('') : '';
  const review = f.file.needs_review.length ? `<div class="warning">${f.file.needs_review.length} page(s) were hard to read and may be missing text:
      ${f.file.needs_review.slice(0, 30).map(p => pageBtn(p)).join('')}${f.file.needs_review.length > 30 ? ' …' : ''}</div>` : '';
  return `<div class="grid2"><div><h4 style="margin-top:0">Case details</h4><dl class="kv">${details}</dl></div>
    <div><h4 style="margin-top:0">The file</h4><dl class="kv"><dt>Pages</dt><dd>${f.file.pages.toLocaleString()} (${f.file.duplicates} duplicates)</dd>
      <dt>Scanned (OCR)</dt><dd>${f.file.scanned.toLocaleString()}</dd><dt>Page types</dt><dd>${types}</dd></dl></div></div>
    ${review}${qs}${dx}`;
}

$('key').value = savedKey();
loadHealth(); loadCases(); renderThread();
</script>
